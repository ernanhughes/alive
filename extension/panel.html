<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ALIVE perception</title>
    <style>
      body {
        font: 13px system-ui;
        background: #111e18;
        color: #deebd5;
        padding: 20px;
      }
      h1 {
        letter-spacing: 3px;
        font-size: 25px;
      }
      label {
        display: block;
        margin: 18px 0;
        font-size: 11px;
        color: #9caf92;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 7px;
        padding: 10px;
        background: #203127;
        color: #e3edd9;
        border: 1px solid #48603d;
        border-radius: 5px;
      }
      input[type="checkbox"] {
        width: auto;
      }
      button {
        padding: 10px;
        margin: 3px;
        background: #c7ed9d;
        color: #274320;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 11px;
        background: #203127;
        padding: 12px;
        border-radius: 5px;
      }
      p {
        line-height: 1.6;
      }
      #status {
        color: #b3d68c;
      }
    </style>
  </head>
  <body>
    <h1>ALIVE <small>01</small></h1>
    <p>Browser perception, with your permission.</p>
    <label
      >Local backend<input
        id="backend"
        disabled
        value="http://127.0.0.1:8000" /></label
    ><label>Local token<input id="token" type="password" disabled /></label
    ><button id="connect" disabled>Save & connect</button>
    <p id="status" role="status">Not connected</p>
    <label
      ><input id="auto" type="checkbox" /> Send observations automatically while
      observing</label
    ><button id="start">Authorise this page</button
    ><button id="stop">Stop & revoke</button>
    <p>
      Reads visible text only. Form values and marked private content are
      excluded. Review the preview before sending.
    </p>
    <h2>Selected observation</h2>
    <pre id="preview">No observation yet.</pre>
    <button id="send">Send selected observation</button>
    <h2>Runtime</h2>
    <pre id="state">Awaiting connection.</pre>
    <script src="panel.js" type="module"></script>
  </body>
</html>
