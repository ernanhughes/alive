services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alive}
      POSTGRES_USER: ${POSTGRES_USER:-alive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    volumes:
      - alive-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-alive} -d $${POSTGRES_DB:-alive}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        # Demo default: include Google Chrome. Set ALIVE_INSTALL_BROWSER=false for a slim image.
        ALIVE_INSTALL_BROWSER: ${ALIVE_INSTALL_BROWSER:-true}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alive}:${POSTGRES_PASSWORD:-change-me-for-local-use}@db:5432/${POSTGRES_DB:-alive}
      ALIVE_API_TOKEN: ${ALIVE_API_TOKEN:?Run scripts/init.ps1 in this checkout to set ALIVE_API_TOKEN}
      ALIVE_ALLOWED_ORIGINS: '["http://localhost:${ALIVE_HOST_PORT:-8000}","http://127.0.0.1:${ALIVE_HOST_PORT:-8000}"]'
      # The managed browser runs inside the app container, so its own 8000 port is the target.
      ALIVE_BROWSER_ORIGINS: '["http://127.0.0.1:8000","http://localhost:8000"]'
      # The demo image includes Chrome. Set ALIVE_INSTALL_BROWSER=false and this to false for
      # a slim deployment; the dashboard then disables the browser controls.
      ALIVE_BROWSER_AVAILABLE: ${ALIVE_BROWSER_AVAILABLE:-true}
      # The demo enables the research experiment harness. Set false to hide it in the dashboard.
      ALIVE_EXPERIMENTS_ENABLED: ${ALIVE_EXPERIMENTS_ENABLED:-true}
      ALIVE_COGNITIVE_PROVIDER: ${ALIVE_COGNITIVE_PROVIDER:-mock}
      ALIVE_DEMO_MODE: ${ALIVE_DEMO_MODE:-true}
      # The image bakes the pinned 384-dimensional MiniLM model. Disable only for a text-only
      # deployment; the dashboard then reports semantic search as unavailable.
      ALIVE_EMBEDDING_ENABLED: ${ALIVE_EMBEDDING_ENABLED:-true}
      ALIVE_EMBEDDING_PATH: /app/models/minilm
      # Optional Ollama on the host. Docker Desktop resolves host.docker.internal; Linux gets
      # it from extra_hosts below. Ollama must listen on 0.0.0.0:11434 to accept this connection.
      ALIVE_OLLAMA_URL: ${ALIVE_OLLAMA_URL:-http://host.docker.internal:11434}
      ALIVE_OLLAMA_CHAT_MODEL: ${ALIVE_OLLAMA_CHAT_MODEL:-}
      # The image contains the pinned Pi runtime. Docker-specific overrides are separate from
      # the host ALIVE_PI_* values so local cloud-provider credentials are not copied into the
      # container. Empty values let ALIVE auto-detect a small installed Ollama chat model.
      ALIVE_PI_COMMAND: '["pi"]'
      ALIVE_PI_PROVIDER: ${ALIVE_DOCKER_PI_PROVIDER:-}
      ALIVE_PI_MODEL: ${ALIVE_DOCKER_PI_MODEL:-}
      # Deterministic, non-external fixture providers (local_fixture_claim, local_stub_invalid)
      # for the pinned /demo-live-01 mirrors. Tied to demo mode so it is off whenever demo mode is
      # off. The paid Meta claim/research flags are deliberately not set here.
      ALIVE_RELATIONSHIP_ALLOW_TEST_PROVIDERS: ${ALIVE_DEMO_MODE:-true}
      # Enables the one-click Demonstration tab (alive/demo_tour.py). Same demo-mode gate.
      ALIVE_DEMO_TOUR_ENABLED: ${ALIVE_DEMO_MODE:-true}
      # Optional live-inference credentials. Empty by default (no paid calls).
      # Set ALIVE_META_API_KEY in an ignored .env file; never commit it.
      ALIVE_META_API_KEY: ${ALIVE_META_API_KEY:-}
      ALIVE_META_MODEL: ${ALIVE_META_MODEL:-muse-spark-1.3}
    ports:
      # Host port 8000 matches the unpacked Chrome extension (host_permissions, authorised
      # pages, default backend) and the server's PAGES allow-list. Overriding it also moves the
      # dashboard, but the extension will not follow.
      - "127.0.0.1:${ALIVE_HOST_PORT:-8000}:8000"
    extra_hosts:
      # Linux Docker needs this mapping for the optional host Ollama probe.
      - "host.docker.internal:host-gateway"
    volumes:
      - alive-appdata:/app/.alive
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  alive-pgdata:
  alive-appdata:
