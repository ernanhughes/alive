services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alive}
      POSTGRES_USER: ${POSTGRES_USER:-alive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    volumes:
      - alive-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-alive} -d $${POSTGRES_DB:-alive}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alive}:${POSTGRES_PASSWORD:-change-me-for-local-use}@db:5432/${POSTGRES_DB:-alive}
      ALIVE_API_TOKEN: ${ALIVE_API_TOKEN:?Run scripts/init.ps1 in this checkout to set ALIVE_API_TOKEN}
      ALIVE_ALLOWED_ORIGINS: '["http://localhost:${ALIVE_HOST_PORT:-8000}","http://127.0.0.1:${ALIVE_HOST_PORT:-8000}"]'
      ALIVE_BROWSER_ORIGINS: '["http://app:8000","http://localhost:${ALIVE_HOST_PORT:-8000}","http://127.0.0.1:8000"]'
      ALIVE_COGNITIVE_PROVIDER: ${ALIVE_COGNITIVE_PROVIDER:-mock}
      ALIVE_DEMO_MODE: ${ALIVE_DEMO_MODE:-true}
      # Deterministic, non-external fixture providers (local_fixture_claim, local_stub_invalid)
      # for the pinned /demo-live-01 mirrors. Tied to demo mode so it is off whenever demo mode is
      # off. The paid Meta claim/research flags are deliberately not set here.
      ALIVE_RELATIONSHIP_ALLOW_TEST_PROVIDERS: ${ALIVE_DEMO_MODE:-true}
      # Optional live-inference credentials. Empty by default (no paid calls).
      # Set ALIVE_META_API_KEY in an ignored .env file; never commit it.
      ALIVE_META_API_KEY: ${ALIVE_META_API_KEY:-}
      ALIVE_META_MODEL: ${ALIVE_META_MODEL:-muse-spark-1.3}
    ports:
      # Host port 8000 matches the unpacked Chrome extension (host_permissions, authorised
      # pages, default backend) and the server's PAGES allow-list. Overriding it also moves the
      # dashboard, but the extension will not follow.
      - "127.0.0.1:${ALIVE_HOST_PORT:-8000}:8000"
    volumes:
      - alive-appdata:/app/.alive
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  alive-pgdata:
  alive-appdata:
