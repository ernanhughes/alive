services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alive_e2e}
      POSTGRES_USER: ${POSTGRES_USER:-alive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    volumes:
      - alive-e2e-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-alive} -d $${POSTGRES_DB:-alive_e2e}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      args:
        ALIVE_INSTALL_BROWSER: "false"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alive}:${POSTGRES_PASSWORD:-change-me-for-local-use}@db:5432/${POSTGRES_DB:-alive_e2e}
      # FINISH-01R: this composed database is a local demo target. A production compose
      # must override this with production:<database> and set ALIVE_ALLOW_PRODUCTION_MIGRATION=1.
      ALIVE_DB_TARGET: disposable:${POSTGRES_DB:-alive_e2e}
      ALIVE_API_TOKEN: ${ALIVE_API_TOKEN:-alive-e2e-token-replace-for-local-use-0}
      ALIVE_ALLOWED_ORIGINS: '["http://localhost:8081","http://127.0.0.1:8081"]'
      ALIVE_BROWSER_ORIGINS: '["http://127.0.0.1:8000","http://localhost:8000"]'
      ALIVE_COGNITIVE_PROVIDER: mock
      ALIVE_DEMO_MODE: "false"
      ALIVE_BROWSER_AVAILABLE: "false"
      ALIVE_EXPERIMENTS_ENABLED: "false"
    volumes:
      - alive-e2e-appdata:/app/.alive
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  e2e:
    build:
      context: .
      args:
        ALIVE_INSTALL_BROWSER: "false"
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["python", "scripts/docker-e2e.py"]
    environment:
      ALIVE_BASE_URL: http://app:8000
      ALIVE_API_TOKEN: ${ALIVE_API_TOKEN:-alive-e2e-token-replace-for-local-use-0}
    restart: "no"

volumes:
  alive-e2e-pgdata:
  alive-e2e-appdata:
