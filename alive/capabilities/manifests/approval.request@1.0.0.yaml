schema_version: 1
id: approval.request
version: 1.0.0
name: Approval Request
description: Block a run until the owner approves or refuses.
implementation:
  provider: builtin
  id: approval-request-v1
execution:
  kind: approval_gate
  side_effects: none
  timeout_seconds: 3600
  max_input_bytes: 65536
  max_output_bytes: 65536
  max_input_items: 32
  max_invocations: 1
  retry_policy: none
  max_model_calls: 0
  max_output_tokens: 0
permissions:
  filesystem:
    mode: none
    roots: []
  network:
    mode: none
  process:
    mode: none
  evidence: none
  persistence: none
inputs:
  type: object
  additionalProperties: false
  properties: {}
  required: []
outputs:
  type: object
  additionalProperties: false
  properties: {}
  required: []
presentation:
  category: legacy
  icon: layers
  tags:
  - workflow
