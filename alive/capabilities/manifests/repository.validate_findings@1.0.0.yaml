schema_version: 1
id: repository.validate_findings
version: 1.0.0
name: Repository Findings Validation
description: Check that every cited file, line range and quotation in a repository analysis
  exists in the captured files, and compose a report. Existence is not correctness; nothing
  is marked verified.
implementation:
  provider: builtin
  id: repository-findings-validator-v1
execution:
  kind: validation
  side_effects: none
  timeout_seconds: 60
  max_input_bytes: 65536
  max_output_bytes: 65536
  max_input_items: 8
  max_invocations: 1
  retry_policy: none
  max_model_calls: 0
  max_output_tokens: 0
permissions:
  filesystem:
    mode: none
    roots: []
  network:
    mode: none
  process:
    mode: none
  evidence: none
  persistence: none
inputs:
  type: object
  additionalProperties: false
  properties:
    analysis:
      type: object
      additionalProperties: true
      properties: {}
      required: []
    source_ref:
      type: string
      maxLength: 36
    source_sha256:
      type: string
      maxLength: 64
    scoped_sha256:
      type: string
      maxLength: 64
    objective:
      type: string
      maxLength: 1000
    files:
      type: array
      maxItems: 8
      items:
        type: object
        additionalProperties: false
        properties:
          path:
            type: string
            maxLength: 256
          content:
            type: string
            maxLength: 32768
          sha256:
            type: string
            maxLength: 64
          bytes:
            type: integer
            minimum: 0
            maximum: 32768
          source_id:
            type: string
            maxLength: 200
          locator:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                maxLength: 8
                enum:
                - file
              path:
                type: string
                maxLength: 256
              sha256:
                type: string
                maxLength: 64
            required:
            - kind
            - path
            - sha256
        required:
        - path
        - content
        - sha256
        - bytes
        - source_id
        - locator
    omitted:
      type: array
      maxItems: 256
      items:
        type: object
        additionalProperties: false
        properties:
          path:
            type: string
            maxLength: 256
          reason:
            type: string
            maxLength: 100
        required:
        - path
        - reason
  required:
  - analysis
  - source_ref
  - source_sha256
  - scoped_sha256
  - objective
  - files
  - omitted
outputs:
  type: object
  additionalProperties: false
  properties:
    result:
      type: object
      additionalProperties: true
      properties: {}
      required: []
    assessment:
      type: object
      additionalProperties: true
      properties: {}
      required: []
  required:
  - result
  - assessment
presentation:
  category: development
  icon: shield-check
  tags:
  - validation
  - citations
