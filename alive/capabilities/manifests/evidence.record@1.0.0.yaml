schema_version: 1
id: evidence.record
version: 1.0.0
name: Evidence Record
description: Persist an accepted result and its provenance as evidence.
implementation:
  provider: builtin
  id: evidence-record-v1
execution:
  kind: deterministic
  side_effects: write
  timeout_seconds: 3600
  max_input_bytes: 65536
  max_output_bytes: 65536
  max_input_items: 32
  max_invocations: 1
  retry_policy: none
  max_model_calls: 0
  max_output_tokens: 0
permissions:
  filesystem:
    mode: none
    roots: []
  network:
    mode: none
  process:
    mode: none
  evidence: none
  persistence: none
inputs:
  type: object
  additionalProperties: false
  properties: {}
  required: []
outputs:
  type: object
  additionalProperties: false
  properties: {}
  required: []
presentation:
  category: legacy
  icon: layers
  tags:
  - workflow
