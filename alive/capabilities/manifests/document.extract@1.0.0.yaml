schema_version: 1
id: document.extract
version: 1.0.0
name: Document Extraction
description: Return a bounded window of sections from an owner-approved captured text, Markdown or HTML
  document, with section locators and the identity of the parser that produced them. PDF is not supported.
  Extraction is not verification.
implementation:
  provider: builtin
  id: document-extractor-v1
execution:
  kind: deterministic
  side_effects: read
  timeout_seconds: 30
  max_input_bytes: 4096
  max_output_bytes: 65536
  max_input_items: 4
  max_invocations: 1
  retry_policy: none
permissions:
  filesystem:
    mode: none
    roots: []
  network:
    mode: none
  process:
    mode: none
  evidence: none
  persistence: none
  sources: approved_capture
inputs:
  type: object
  additionalProperties: false
  properties:
    source_ref:
      type: string
      maxLength: 36
    start:
      type: integer
      minimum: 0
      maximum: 100000
    count:
      type: integer
      minimum: 1
      maximum: 12
    max_chars:
      type: integer
      minimum: 64
      maximum: 4096
  required:
  - source_ref
  - start
  - count
  - max_chars
outputs:
  type: object
  additionalProperties: false
  properties:
    source_ref:
      type: string
      maxLength: 36
    source_sha256:
      type: string
      maxLength: 64
    scoped_sha256:
      type: string
      maxLength: 64
    format:
      type: string
      maxLength: 8
      enum:
      - text
      - markdown
      - html
    parser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 64
        sha256:
          type: string
          maxLength: 64
      required:
      - id
      - sha256
    sections:
      type: array
      maxItems: 12
      items:
        type: object
        additionalProperties: false
        properties:
          index:
            type: integer
            minimum: 0
            maximum: 100000
          heading:
            type: string
            maxLength: 200
          text:
            type: string
            maxLength: 4096
          truncated:
            type: boolean
          char_count:
            type: integer
            minimum: 0
            maximum: 4096
          sha256:
            type: string
            maxLength: 64
          line_start:
            type: integer
            minimum: 0
            maximum: 10000000
          line_end:
            type: integer
            minimum: 0
            maximum: 10000000
          locator:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                maxLength: 16
                enum:
                - section
              index:
                type: integer
                minimum: 0
                maximum: 100000
              sha256:
                type: string
                maxLength: 64
            required:
            - kind
            - index
            - sha256
        required:
        - index
        - heading
        - text
        - truncated
        - char_count
        - sha256
        - line_start
        - line_end
        - locator
    total_sections:
      type: integer
      minimum: 0
      maximum: 512
    next_start:
      type: integer
      minimum: 0
      maximum: 100000
    complete:
      type: boolean
    truncated_at_capture:
      type: boolean
    provenance:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          maxLength: 24
          enum:
          - approved_capture/v1
        source_type:
          type: string
          maxLength: 16
        classification:
          type: string
          maxLength: 24
        captured_at:
          type: string
          maxLength: 40
        approval_expires_at:
          type: string
          maxLength: 40
        atomic_repository_snapshot:
          type: boolean
      required:
      - kind
      - source_type
      - classification
      - captured_at
      - approval_expires_at
      - atomic_repository_snapshot
    semantic_status:
      type: string
      maxLength: 12
      enum:
      - unverified
  required:
  - source_ref
  - source_sha256
  - scoped_sha256
  - format
  - parser
  - sections
  - total_sections
  - complete
  - truncated_at_capture
  - provenance
  - semantic_status
presentation:
  category: research
  icon: file-text
  tags:
  - document
  - extraction
  - source
supported_source_types:
- document
examples:
- source_ref: 00000000-0000-0000-0000-000000000000
  start: 0
  count: 3
  max_chars: 1000
