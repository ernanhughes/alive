schema_version: 1
id: context.reason
version: 1.0.0
name: Contextual Reasoning
description: One read-only model response over approved source and frozen same-conversation
  evidence.
implementation:
  provider: builtin
  id: contextual-reasoner-v1
execution:
  kind: pi_agent
  side_effects: none
  timeout_seconds: 120
  max_input_bytes: 65536
  max_output_bytes: 65536
  max_input_items: 8
  max_invocations: 1
  retry_policy: none
  max_model_calls: 1
  max_output_tokens: 1536
permissions:
  filesystem:
    mode: none
    roots: []
  network:
    mode: governed_pi
  process:
    mode: none
  evidence: none
  persistence: none
  sources: approved_capture
inputs:
  type: object
  additionalProperties: false
  properties:
    source_ref:
      type: string
      maxLength: 36
    paths:
      type: array
      maxItems: 8
      items:
        type: string
        maxLength: 256
    objective:
      type: string
      maxLength: 1000
    context_ref:
      type: string
      maxLength: 36
    context_sha256:
      type: string
      maxLength: 64
    model_input_sha256:
      type: string
      maxLength: 64
  required:
  - source_ref
  - paths
  - objective
  - context_ref
  - context_sha256
  - model_input_sha256
outputs:
  type: object
  additionalProperties: false
  properties:
    answer:
      type: object
      additionalProperties: true
      properties: {}
      required: []
    snapshot:
      type: object
      additionalProperties: true
      properties: {}
      required: []
  required:
  - answer
  - snapshot
presentation:
  category: development
  icon: brain-circuit
  tags:
  - interpretation
  - model
supported_source_types:
- repository
examples: []
