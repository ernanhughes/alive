schema_version: 1
id: evidence.evaluate
version: 1.0.0
name: Evidence Evaluate
description: Compare observed and proposed content against its sources.
implementation:
  provider: builtin
  id: evidence-evaluate-v1
execution:
  kind: validation
  side_effects: none
  timeout_seconds: 3600
  max_input_bytes: 65536
  max_output_bytes: 65536
  max_input_items: 32
  max_invocations: 1
  retry_policy: none
  max_model_calls: 0
  max_output_tokens: 0
permissions:
  filesystem:
    mode: none
    roots: []
  network:
    mode: none
  process:
    mode: none
  evidence: approved_context
  persistence: none
inputs:
  type: object
  additionalProperties: false
  properties:
    claims:
      type: array
      maxItems: 256
      items:
        type: object
        additionalProperties: true
        properties: {}
        required: []
    sources:
      type: array
      maxItems: 256
      items:
        type: object
        additionalProperties: true
        properties: {}
        required: []
  required:
  - claims
  - sources
outputs:
  type: object
  additionalProperties: false
  properties:
    result:
      type: object
      additionalProperties: true
      properties: {}
      required: []
    assessment:
      type: object
      additionalProperties: true
      properties: {}
      required: []
  required:
  - result
  - assessment
presentation:
  category: legacy
  icon: layers
  tags:
  - workflow
