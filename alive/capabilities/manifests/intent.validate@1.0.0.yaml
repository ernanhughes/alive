schema_version: 1
id: intent.validate
version: 1.0.0
name: Intent Interpretation Validation
description: Check that an interpretation keeps the owner's goal unchanged. Structure was
  enforced by the output schema. Nothing about the interpretation is marked verified.
implementation:
  provider: builtin
  id: intent-validator-v1
execution:
  kind: validation
  side_effects: none
  timeout_seconds: 30
  max_input_bytes: 65536
  max_output_bytes: 65536
  max_input_items: 4
  max_invocations: 1
  retry_policy: none
  max_model_calls: 0
  max_output_tokens: 0
permissions:
  filesystem:
    mode: none
    roots: []
  network:
    mode: none
  process:
    mode: none
  evidence: none
  persistence: none
inputs:
  type: object
  additionalProperties: false
  properties:
    interpretation:
      type: object
      additionalProperties: true
      properties: {}
      required: []
    objective:
      type: string
      maxLength: 1000
    catalogue_sha256:
      type: string
      maxLength: 64
  required:
  - interpretation
  - objective
  - catalogue_sha256
outputs:
  type: object
  additionalProperties: false
  properties:
    result:
      type: object
      additionalProperties: true
      properties: {}
      required: []
    assessment:
      type: object
      additionalProperties: true
      properties: {}
      required: []
  required:
  - result
  - assessment
presentation:
  category: development
  icon: shield-check
  tags:
  - validation
  - interpretation
