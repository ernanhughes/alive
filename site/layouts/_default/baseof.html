<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;margin:0;color:#1d2330;background:#fff}
.wrap{max-width:46rem;margin:0 auto;padding:0 1rem}
header.site,footer.site{border-color:#d7dbe4;border-style:solid;border-width:0;padding:.8rem 0;font-size:.9rem;color:#4a5265}
header.site{border-bottom-width:1px}footer.site{border-top-width:1px;margin-top:2rem}
nav.toc{font-size:.9rem;margin:1rem 0}nav.toc ul{padding-left:1.1rem;margin:.2rem 0}
code{font-size:.9em}pre{overflow:auto}
@media(prefers-color-scheme:dark){body{background:#14171f;color:#e4e7ee}a{color:#8db4ff}}
</style>
</head>
<body>
<div class="wrap">
<header class="site"><nav aria-label="Site"><a href="{{ "/" | relURL }}">{{ site.Title }}</a> · <a href="{{ "/chapters/" | relURL }}">Chapters</a></nav></header>
{{ block "main" . }}{{ end }}
<footer class="site">{{ block "footer" . }}Generated by <code>site/notebook.py</code>. Canonical sources live under <code>docs/</code>.{{ end }}</footer>
</div>
</body>
</html>
