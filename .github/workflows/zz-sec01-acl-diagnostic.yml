# TEMPORARY. Diagnoses the SEC-01 Windows ACL test on the real runner. Deleted before the PR is done.
name: SEC-01 ACL diagnostic (temporary)
on:
  pull_request:
    paths: [".github/diag/**", ".github/workflows/zz-sec01-acl-diagnostic.yml"]
jobs:
  acl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - name: print the runner's token-file ACL at each stage
        run: uv run python .github/diag/acl_diag.py
      - name: fail on purpose so the result is impossible to miss
        run: exit 1
