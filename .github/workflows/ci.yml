name: ALIVE checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check alive migrations scripts tests
      - run: uv run ruff format --check alive migrations scripts tests
      - run: uv run python scripts/verify_archive.py archives/ALIVE-14-R1
      - run: uv run python scripts/verify_archive.py archives/ALIVE-14-R2
      - run: uv run python scripts/verify_archive.py archives/ALIVE-14-R3
      - run: uv run python scripts/verify_archive.py archives/ALIVE-14-R4
      - run: uv run python scripts/verify_archive.py archives/ALIVE-14-R5
      - run: uv run python scripts/verify_archive.py archives/ALIVE-14-R5-R1
      - run: uv run python scripts/verify_alive14_protocol.py
      - run: uv run python scripts/verify_alive14r2_protocol.py
      - run: uv run python scripts/verify_alive14r3_protocol.py
      - run: uv run pytest -q
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --test ../tests/extension-panel.test.cjs
      - run: node --test ../tests/extension-background.test.cjs
      - run: node --test ../tests/extension-capture.test.cjs ../tests/extension-live-background.test.cjs ../tests/extension-live-companion.test.cjs
      - run: npm run build
  first-contact-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: alive
          POSTGRES_USER: alive
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alive -d alive"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://alive:ephemeral-ci-only@127.0.0.1:5432/alive
      ALIVE_API_TOKEN: ephemeral-ci-token-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --locked
      - run: npm ci --prefix dashboard
      - run: uv run playwright install --with-deps chrome
      - run: uv run python -m scripts.first_contact --runner mock
      - run: uv run python -m scripts.first_thought --provider mock
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install pinned Hugo with release checksum verification
        shell: bash
        run: |
          curl --fail --location --retry 3 -O https://github.com/gohugoio/hugo/releases/download/v0.165.0/hugo_0.165.0_linux-amd64.tar.gz
          curl --fail --location --retry 3 -O https://github.com/gohugoio/hugo/releases/download/v0.165.0/hugo_0.165.0_checksums.txt
          grep ' hugo_0.165.0_linux-amd64.tar.gz$' hugo_0.165.0_checksums.txt | sha256sum --check --strict
          tar -xzf hugo_0.165.0_linux-amd64.tar.gz hugo
          sudo install hugo /usr/local/bin/hugo
          hugo version
      - run: uv sync --locked
      - run: npm ci --prefix dashboard
      - run: hugo --source site --environment production --cleanDestinationDir
      - run: uv run python site/notebook.py check --public site/public
      - run: uv run pytest -q -ra tests/test_notebook_01.py
      - run: node --test tests/notebook-capture.test.cjs
      - run: uv run python -m scripts.notebook02_evaluation --output "$RUNNER_TEMP/notebook02-evaluation.json"
      - run: uv run python -m scripts.notebook02_evaluation --derive-from docs/validation/alive-notebook-02/evaluation.json --output "$RUNNER_TEMP/notebook02-r1-derived.json"
      - run: uv run python -m scripts.notebook03a validate
      - run: uv run python -m scripts.notebook03a submission
      - run: uv run python -m scripts.notebook03a baseline --check-against docs/validation/alive-notebook-03a/expected-baselines-v14.json --output "$RUNNER_TEMP/notebook03a-baseline.json"
      - run: uv run python -m scripts.notebook03a_r1 validate
      - run: uv run python -m scripts.notebook03a_r1 submission
      - run: uv run python -m scripts.notebook03a_r1 baseline --check-against docs/validation/alive-notebook-03a-r1/expected-baselines.json --output "$RUNNER_TEMP/notebook03a-r1-baseline.json"
      - run: uv run python -m scripts.notebook03a_r2 validate
      - run: uv run python -m scripts.notebook03a_r2 submission
      - run: uv run python -m scripts.notebook03a_r2 audit-package
      - run: uv run python -m scripts.notebook03a_r2 baseline --check-against docs/validation/alive-notebook-03a-r2/expected-baselines.json --output "$RUNNER_TEMP/notebook03a-r2-baseline.json"
      - run: uv run pytest -q tests/test_notebook03a.py tests/test_notebook03a_r1.py tests/test_notebook03a_r2.py
