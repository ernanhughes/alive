[project]
name = "alive-runtime"
version = "0.2.0"
description = "Adaptive Living Intelligence — persistent local runtime"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pydantic-settings>=2.8",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30",
  "alembic>=1.15",
  "pyzmq>=26",
  "pgvector>=0.3",
  "beautifulsoup4>=4.13",
  "httpx>=0.28",
  "playwright>=1.51",
  "aiosqlite>=0.21",
  "filelock>=4.2.4",
  "tornado>=6.6",
  "websockets>=17.3",
  "onnxruntime>=1.31.1",
  "tokenizers>=0.23.3",
  "huggingface-hub>=2.3.0",
  "numpy>=2.5.4",
  "pyyaml>=6.0.3,<7",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "alive/intelligence/tests"]
markers = ["slow: long-running suite (excluded from bare pytest default; run explicitly)"]
# Fast default: bare `pytest` runs only fast tests (~1 min target).
# Full qualification: `pytest -o addopts=""` or `python scripts/test_run.py --mode full`.
addopts = ["-m", "not slow"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
